<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <title>sushizanmai</title>
        <link rel="stylesheet" type="text/css" href="./css/style.css">
    </head>

    <body>
        <nav class="sticky top-0 z-50 bg-(--nav-bg) backdrop-blur border-b border-(--border)">
            <div class="mx-auto max-w-[1100px] px-4 py-3 flex flex-wrap items-center gap-x-6 gap-y-1">
                <a class="text-lg font-semibold text-(--ink)" href="#">sushizanmai</a>

                <ul class="flex flex-wrap items-center gap-x-4">
                    <li>
                        <a class="text-(--ink-secondary) hover:text-(--ink)" href="#keys-graph">Keys</a>
                    </li>
                    <li>
                        <a class="text-(--ink-secondary) hover:text-(--ink)" href="#speed-graph">Speed</a>
                    </li>
                    <li>
                        <a class="text-(--ink-secondary) hover:text-(--ink)" href="#miss-graph">Miss</a>
                    </li>
                </ul>

                <a class="ml-auto text-(--ink-secondary) hover:text-(--ink)" href="https://github.com/struuuuggle/sushizanmai" target="_blank" rel="noopener noreferrer" aria-label="GitHub repository">
                    <span class="icon-github"></span>
                </a>
            </div>
        </nav>



        <div class="mx-auto max-w-[1100px] px-4 pb-8">
            <div class="text-center">
                <h2 class="text-2xl sm:text-3xl font-bold tracking-tight my-4">寿司打(10000円コース)の記録</h2>
            </div>

            <section class="latest mt-6 rounded-xl bg-(--accent) text-(--on-accent) px-4 py-5 sm:px-6 sm:py-6">
                <h3 class="text-2xl min-[400px]:text-3xl sm:text-4xl font-bold leading-tight">最新の記録<span class="ml-2 text-xs sm:text-sm font-normal text-(--on-accent-muted)" id="latest-meta"></span></h3>

                <!-- Each tile inherits the dl's two rows via subgrid, so the
                     labels share one row and the values another however a
                     label wraps on a narrow screen. -->
                <dl class="mt-3 grid grid-cols-3 grid-rows-[auto_auto] gap-x-2 sm:gap-x-6">
                    <div class="grid row-span-2 grid-rows-subgrid">
                        <dt class="text-sm sm:text-lg font-bold text-(--on-accent-muted)">タイプ数</dt>
                        <dd class="text-2xl min-[400px]:text-3xl sm:text-4xl font-bold leading-tight">
                            <span id="latest-keys">–</span>
                            <span class="text-xs sm:text-sm font-bold text-(--on-accent-muted)">keys</span>
                        </dd>
                    </div>
                    <div class="grid row-span-2 grid-rows-subgrid">
                        <dt class="text-sm sm:text-lg font-bold text-(--on-accent-muted)">速度</dt>
                        <dd class="text-2xl min-[400px]:text-3xl sm:text-4xl font-bold leading-tight">
                            <span id="latest-speed">–</span>
                            <span class="text-xs sm:text-sm font-bold text-(--on-accent-muted)">keys/sec</span>
                        </dd>
                    </div>
                    <div class="grid row-span-2 grid-rows-subgrid">
                        <dt class="text-sm sm:text-lg font-bold text-(--on-accent-muted)">ミスタイプ数</dt>
                        <dd class="text-2xl min-[400px]:text-3xl sm:text-4xl font-bold leading-tight">
                            <span id="latest-miss">–</span>
                            <span class="text-xs sm:text-sm font-bold text-(--on-accent-muted)">keys</span>
                        </dd>
                    </div>
                </dl>
            </section>

            <p class="text-xs text-(--ink-muted) mt-8 mb-2">⌘ / Ctrl + ホイールで横軸を拡大縮小・ドラッグで左右に移動・ダブルクリックでリセット</p>

            <div class="keys rounded-xl border border-(--border) bg-(--surface) p-4 sm:p-5 scroll-mt-16" id="keys-graph">
                <h3 class="text-2xl min-[400px]:text-3xl sm:text-4xl font-semibold leading-tight mb-3">正しく打ったキーの数</h3>
            </div>

            <div class="speed mt-8 rounded-xl border border-(--border) bg-(--surface) p-4 sm:p-5 scroll-mt-16" id="speed-graph">
                <h3 class="text-2xl min-[400px]:text-3xl sm:text-4xl font-semibold leading-tight mb-3">タイピング速度</h3>
            </div>

            <div class="miss mt-8 rounded-xl border border-(--border) bg-(--surface) p-4 sm:p-5 scroll-mt-16" id="miss-graph">
                <h3 class="text-2xl min-[400px]:text-3xl sm:text-4xl font-semibold leading-tight mb-3">ミスタイプ数</h3>
            </div>
        </div>

        <footer class="border-t border-(--border)">
            <div class="mx-auto max-w-[1100px] px-4 py-6 text-center text-(--ink-secondary)">
                <p>© 2018–2026 <a class="text-(--series-keys) hover:underline" href="https://x.com/struuuuggle" target="_blank" rel="noopener noreferrer">@struuuuggle</a></p>
            </div>
        </footer>

        <script src="./js/vendor/d3.min.js"></script>
        <script type="module" src="./js/latest.js"></script>
        <script type="module" src="./js/keys.js"></script>
        <script type="module" src="./js/speed.js"></script>
        <script type="module" src="./js/miss.js"></script>
    </body>
</html>
