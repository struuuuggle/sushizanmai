<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <title>sushizanmai</title>
        <link rel="stylesheet" type="text/css" href="./css/style.css">
    </head>

    <body>
        <nav class="sticky top-0 z-50 bg-(--nav-bg) backdrop-blur border-b border-(--border)">
            <div class="mx-auto max-w-[1100px] px-4 py-3 flex flex-wrap items-center gap-x-6 gap-y-1">
                <a class="text-lg font-semibold text-(--ink)" href="#">sushizanmai</a>

                <ul class="flex flex-wrap items-center gap-x-4">
                    <li>
                        <a class="text-(--ink-secondary) hover:text-(--ink)" href="#type-graph">Type</a>
                    </li>
                    <li>
                        <a class="text-(--ink-secondary) hover:text-(--ink)" href="#speed-graph">Speed</a>
                    </li>
                    <li>
                        <a class="text-(--ink-secondary) hover:text-(--ink)" href="#miss-graph">Miss</a>
                    </li>
                </ul>
            </div>
        </nav>



        <div class="mx-auto max-w-[1100px] px-4">
            <div class="text-center">
                <h2 class="text-2xl sm:text-3xl font-bold tracking-tight my-4">寿司打(10000円コース)の記録</h2>
                <p class="text-(--ink-secondary)"><a class="text-(--series-type) hover:underline" href="https://twitter.com/struuuuggle">@struuuuggle</a> の記録</p>
            </div>

            <p class="text-xs text-(--ink-muted) mt-8 mb-2">⌘ / Ctrl + ホイールで横軸を拡大縮小・ドラッグで左右に移動・ダブルクリックでリセット</p>

            <div class="type rounded-xl border border-(--border) bg-(--surface) p-4 sm:p-5 scroll-mt-16" id="type-graph">
                <h3 class="text-lg font-semibold mb-2">総タイプ数(type)</h3>
            </div>

            <div class="speed mt-8 rounded-xl border border-(--border) bg-(--surface) p-4 sm:p-5 scroll-mt-16" id="speed-graph">
                <h3 class="text-lg font-semibold mb-2">タイピング速度(speed)</h3>
            </div>

            <div class="miss mt-8 rounded-xl border border-(--border) bg-(--surface) p-4 sm:p-5 scroll-mt-16" id="miss-graph">
                <h3 class="text-lg font-semibold mb-2">ミスタイプ数(miss)</h3>
            </div>

            <footer class="my-8">
                <p>
                    <img src="./images/bn.gif">
                </p>
                <p class="mt-4">
                    <a class="github-button" href="https://github.com/struuuuggle" data-size="large" data-color-scheme="no-preference: light; light: light; dark: dark" aria-label="Follow @struuuuggle on GitHub">Follow @struuuuggle</a>
                </p>
            </footer>
        </div>
        <!-- Place this tag in your head or just before your close body tag. -->
        <script async defer src="https://buttons.github.io/buttons.js"></script>

        <script src="./js/vendor/d3.min.js"></script>
        <script src="./js/chart.js"></script>
        <script src="./js/type.js"></script>
        <script src="./js/speed.js"></script>
        <script src="./js/miss.js"></script>
    </body>
</html>
